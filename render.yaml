services:
  - type: web
    name: setu-api
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build --workspace=shared && npm run build --workspace=backend
    preDeployCommand: npm run db:push --workspace=backend
    startCommand: npm run start --workspace=backend
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: setu-db
          property: connectionString
      # Seed flag consumed by backend postinstall (prisma.seed.ts).
      # Set 1 on first deploy so demo accounts (student@demo.com etc.)
      # exist; set 0 afterwards to avoid wiping real data on redeploys.
      - key: SEED_DEMO_DATA
        value: "1"

  - type: web
    name: setu-web
    runtime: static
    buildCommand: npm install --include=dev && npm run build --workspace=shared && npm run build --workspace=frontend
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: setu-api
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: setu-db
    plan: free
