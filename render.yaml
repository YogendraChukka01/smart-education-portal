services:
  - type: web
    name: setu-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run build --workspace=backend
    preDeployCommand: npm run db:push --workspace=backend
    startCommand: npm run start --workspace=backend
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: setu-db
          property: connectionString

  - type: web
    name: setu-web
    runtime: static
    buildCommand: npm install && npm run build --workspace=frontend
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: setu-api
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: setu-db
    plan: free
